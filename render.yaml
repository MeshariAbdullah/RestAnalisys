services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: mlr-platform-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node --loader tsx/esm src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: mlr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://mlr-platform.onrender.com
      - key: PLATFORM_COMMERCIAL_ID
        sync: false
      - key: NAFATH_API_KEY
        sync: false
      - key: NAFITH_API_KEY
        sync: false
      - key: PAYMENT_GATEWAY_API_KEY
        sync: false
      - key: ZATCA_API_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: COURIER_WEBHOOK_SECRET
        generateValue: true
      - key: NAFITH_WEBHOOK_SECRET
        generateValue: true
      - key: NAFATH_WEBHOOK_SECRET
        generateValue: true
      - key: API_BASE_URL
        value: https://mlr-platform-api.onrender.com

  # ── Frontend ───────────────────────────────────────────────────
  - type: web
    name: mlr-platform
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://mlr-platform-api.onrender.com

databases:
  - name: mlr-db
    databaseName: mlr_platform
    plan: free
