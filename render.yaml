services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: mlr-platform-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node --loader tsx/esm src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: mlr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://mlr-platform.onrender.com
      - key: PLATFORM_COMMERCIAL_ID
        sync: false
      - key: NAFATH_API_KEY
        sync: false
      - key: NAFITH_API_KEY
        sync: false
      - key: PAYMENT_GATEWAY_API_KEY
        sync: false
      - key: ZATCA_API_KEY
        sync: false
      - key: SPL_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMS_API_KEY
        sync: false

  # ── Frontend ───────────────────────────────────────────────────
  - type: web
    name: mlr-platform
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://mlr-platform-api.onrender.com

databases:
  - name: mlr-db
    databaseName: mlr_platform
    plan: free
